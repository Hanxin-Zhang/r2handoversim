[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "r2handoversim"
version = "0.3.0"
description = "Isaac Sim robot-to-human handover replay demos and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
license = {text = "MIT"}

[project.optional-dependencies]
planning = ["scipy>=1.10"]

[project.scripts]
r2handoversim = "r2handoversim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r2handoversim = ["assets/*.json", "assets/*.txt"]
